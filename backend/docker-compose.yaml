services:
  chroma:
    image: chromadb/chroma
    container_name: chroma
    ports: 
      - "8000:8000"
    volumes:
      - chroma-data:/data
  
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      - ollama
    command: >
      sh -c "
        echo 'Waiting for Ollama to be available...'
        while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
        echo 'Pulling nomic-embed-text...'
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\":\"nomic-embed-text\"}'
        echo 'Models pulled successfully!'
      "

volumes:
  chroma-data:
  ollama-data: