version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: nexa-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: test $$(echo "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok || rs.status().ok" | mongosh --quiet) -eq 1
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: nexa-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

volumes:
  mongodb_data:
  chromadb_data:
